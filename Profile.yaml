projects:
- name: RoboRacer Control Module
  institution: Friedrich-Alexander-Universität Erlangen-Nürnberg, FAU
  period:
    start_approximate: 2026-02
    end: 2026-08
  url: https://github.com/mohammadbrd/Roboracer-Control-Module
  summary: Developed the ROS2 Control module for a team F1TENTH RoboRacer, from simulation through hardware testing;
    generated Ackermann steering and speed commands.
  topics_and_tools:
  - ROS2
  - C++
  - Pure Pursuit
  - PID
  - Ackermann steering
  - odometry
  - F1TENTH
  - trajectory tracking
  - simulation-to-hardware validation
  my_contribution:
  - Developed a ROS2 Control module that generates Ackermann steering and speed commands from the planned path and
    vehicle feedback.
  - Implemented Pure Pursuit lateral path tracking and odometry-feedback PID speed tracking.
  - Calculated cross-track and heading errors and tuned a speed-dependent lookahead in simulation.
  - Corrected a multi-waypoint shortcut by restricting the forward path search to a local window.
  - Adapted and validated the controller on the physical F1TENTH RoboRacer.
  team_context: Other team members developed perception, localization, environmental modelling, overtaking and navigation
    planning.
  hardware_test:
    hardware_test_goals: 3
    localized_distance_m: 31.56
    run_duration_s: 22.1
    maximum_commanded_speed_m_per_s: 1.5
    median_absolute_cross_track_error_m: 0.095
    p95_absolute_cross_track_error_m: 0.242
    p95_absolute_heading_error_deg: 8.67
    final_estimated_distance_to_goal_m: 0.189
    goal_tolerance_m: 0.25
    measurement_basis: onboard localization; not independent ground truth
  related_fau_module: Team Project / Industriepraktikum, 10 ECTS, passed
